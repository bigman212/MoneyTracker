// Compose stability configuration.
//
// This is a compiler contract: only add types that are actually immutable/stable.
// Incorrect entries can break recomposition correctness.
//
// Kotlin 2.0.20+ enables Compose Strong Skipping by default, so unstable
// parameters are less often a correctness/performance problem than before.
// Still prefer stable API surfaces for shared UI state.

// Kotlin read-only collection interfaces. Treat usages as stable only when the
// project does not mutate the backing collection behind the same reference.
kotlin.collections.Collection
kotlin.collections.Iterable
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set

// Java time value types.
java.time.Duration
java.time.Instant
java.time.LocalDate
java.time.LocalDateTime
java.time.LocalTime
java.time.MonthDay
java.time.OffsetDateTime
java.time.OffsetTime
java.time.Period
java.time.Year
java.time.YearMonth
java.time.ZonedDateTime

// Common value types.
java.math.BigDecimal
java.math.BigInteger
